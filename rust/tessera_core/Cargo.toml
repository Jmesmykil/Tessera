[package]
name = "tessera_core"
version.workspace = true
edition.workspace = true
description = "3D-to-sprite core: ASCII universal kernel, sheet driver, QA. One core, compiled two ways."

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
